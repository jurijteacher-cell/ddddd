<!DOCTYPE html>
  <html lang="pl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wpisz poprawną formę</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#15130f; --bg-soft:#1c1a15; --card:#211f19; --card-border:#34302a;
    --gold:#e2b34f; --gold-dim:#7a6431; --text:#f2ede1; --text-dim:#a89d88;
          --ok:#6fae72; --bad:#b5555a;
      }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
        background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:32px 16px 80px;
}
  .wrap{max-width:680px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(24px,5vw,34px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold);font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:520px;margin:0 auto;line-height:1.5;}
  .progress-wrap{max-width:460px;margin:22px auto 32px;}
  .progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:6px;}
  .progress-label b{color:var(--gold);}
  .progress-bar{height:6px;border-radius:4px;background:var(--bg-soft);border:1px solid var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}
  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--card); border:1px solid var(--card-border); border-radius:12px;padding:20px 22px;}
  .stmt{font-size:16px; line-height:1.6; color:var(--text); margin-bottom:6px;}
  .nom{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); letter-spacing:0.05em; margin-bottom:14px;}
  .nom b{color:var(--gold-dim);}
  .input-row{display:flex; gap:10px;}
  input.answer{flex:1; background:var(--bg-soft); border:1.5px solid var(--card-border); border-radius:8px; color:var(--text); font-family:'Playfair Display',serif; font-weight:700; font-size:15px; padding:10px 14px;}
    input.answer:focus{outline:none; border-color:var(--gold-dim);}
  input.answer.correct{border-color:var(--ok); background:rgba(111,174,114,0.12); color:var(--ok);}
  input.answer.wrong{border-color:var(--bad); background:rgba(181,85,90,0.12); color:var(--bad);}
  .check-btn{font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; padding:10px 20px; border-radius:8px; cursor:pointer;background:var(--gold); color:#1a1710; border:none;}
  .check-btn:hover{filter:brightness(1.08);}
  .check-btn:disabled{opacity:0.4; cursor:default;}
  .explanation{display:none; margin-top:14px; padding:12px 14px; border-radius:8px;background:rgba(226,179,79,0.06); border:1px solid var(--gold-dim);color:var(--text-dim); font-size:13.5px; line-height:1.5;}
  .explanation.show{display:block;}
  .explanation b{color:var(--gold);}
  .finale{display:none; text-align:center; margin-top:36px; padding:30px;border:1px solid var(--gold-dim); border-radius:14px;background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);}
  .finale.show{display:block;}
  .finale .big{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:8px;}
  .finale p{color:var(--text-dim);margin:0 0 18px;font-size:14px;}
  .reset-btn{background:transparent;border:1px solid var(--card-border);color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 22px;border-radius:20px;cursor:pointer;}
  .reset-btn:hover{border-color:var(--gold); color:var(--gold);}
</style>
  </head>
  <body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Werba Way · Gramatyka</div>
    <h1>Wpisz <em>poprawną</em> formę</h1>
    <p class="instructions">Rzeczownik w mianowniku jest w nawiasie. Wpisz go w poprawnym przypadku i naciśnij Enter albo "Sprawdź".</p>
    </header>
    <div class="progress-wrap">
      <div class="progress-label"><span>Postęp</span><span><b id="progressCount">0</b> / <span id="progressTotal">0</span></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="finale" id="finale">
      <div class="big">Świetnie! ✍️</div>
      <p>Odpowiedziałeś/aś na wszystkie pytania.</p>
      <button class="reset-btn" id="resetBtn">Zacznij od nowa</button>
  </div>
</div>
<script>
const items = [
{ before: "Dom stoi nad", after: ".", nom: "rzeka", correct: "rzeką", ex: "Stoi <b>gdzie?</b> — nad rzeką (Instrumental)." },
  { before: "Piłka wpadła za", after: ".", nom: "rzeka", correct: "rzekę", ex: "Wpadła <b>dokąd?</b> — za rzekę (Biernik)." },
{ before: "Uczniowie stoją przed", after: ".", nom: "szkoła", correct: "szkołą", ex: "Stoją <b>gdzie?</b> — przed szkołą (Instrumental)." },
{ before: "Autobus podjechał przed", after: ".", nom: "szkoła", correct: "szkołę", ex: "Podjechał <b>dokąd?</b> — przed szkołę (Biernik)." },
{ before: "Śnieg leży na", after: ".", nom: "góra", correct: "górze", ex: "Leży <b>gdzie?</b> — na górze (Miejscownik)." },
{ before: "Turyści weszli na", after: ".", nom: "góra", correct: "górę", ex: "Weszli <b>dokąd?</b> — na górę (Biernik)." },
{ before: "Obraz wisi na", after: ".", nom: "ściana", correct: "ścianie", ex: "Wisi <b>gdzie?</b> — na ścianie (Miejscownik)." },
{ before: "Powiesił obraz na", after: ".", nom: "ściana", correct: "ścianę", ex: "Powiesił <b>dokąd?</b> — na ścianę (Biernik)." },
{ before: "Pies śpi pod", after: ".", nom: "łóżko", correct: "łóżkiem", ex: "Śpi <b>gdzie?</b> — pod łóżkiem (Instrumental)." },
{ before: "Kot wskoczył pod", after: ".", nom: "łóżko", correct: "łóżko", ex: "Wskoczył <b>dokąd?</b> — pod łóżko (Biernik)." }
];

let answeredCount = 0;
const total = items.length;

const cardsEl = document.getElementById('cards');
const progressCount = document.getElementById('progressCount');
const progressTotal = document.getElementById('progressTotal');
const progressFill = document.getElementById('progressFill');
const finale = document.getElementById('finale');

function normalize(s){
    return s.trim().toLowerCase();
}

function build(){
    answeredCount = 0;
  progressTotal.textContent = total;
  progressCount.textContent = 0;
  progressFill.style.width = '0%';
  finale.classList.remove('show');
  cardsEl.innerHTML = '';

  items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
    card.innerHTML = `
            <div class="stmt">${idx + 1}. ${item.before} ______ ${item.after}</div>
        <div class="nom">Mianownik: <b>${item.nom}</b></div>
        <div class="input-row">
          <input type="text" class="answer" placeholder="Wpisz formę..." autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="check-btn">Sprawdź</button>
        </div>
        <div class="explanation"><b>Dlaczego?</b> ${item.ex}</div>
      `;
    const input = card.querySelector('.answer');
    const checkBtn = card.querySelector('.check-btn');

    function checkAnswer(){
            if(input.disabled) return;
      const val = normalize(input.value);
      if(val.length === 0) return;
      input.disabled = true;
      checkBtn.disabled = true;
      if(val === normalize(item.correct)){
        input.classList.add('correct');
      } else {
        input.classList.add('wrong');
        input.value = item.correct;
      }
      card.querySelector('.explanation').classList.add('show');
      answeredCount++;
      progressCount.textContent = answeredCount;
      progressFill.style.width = (answeredCount / total * 100) + '%';
      if(answeredCount === total){
        setTimeout(() => finale.classList.add('show'), 300);
      }
    }

    checkBtn.addEventListener('click', checkAnswer);
    input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') checkAnswer();
});

    cardsEl.appendChild(card);
});
}

document.getElementById('resetBtn').addEventListener('click', build);

build();
</script>
  </body>
  </html>
