<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakie mają hobby? — pytania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130f; --bg-soft:#1c1a15; --card:#211f19; --card-border:#34302a;
    --gold:#e2b34f; --gold-dim:#7a6431; --text:#f2ede1; --text-dim:#a89d88;
    --ok:#6fae72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:32px 16px 72px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,5vw,40px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold);font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:560px;margin:0 auto;line-height:1.5;}
  .progress-wrap{max-width:460px;margin:22px auto 0;}
  .progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:6px;}
  .progress-label b{color:var(--gold);}
  .progress-bar{height:6px;border-radius:4px;background:var(--bg-soft);border:1px solid var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px;}
  @media (max-width:720px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:440px){ .grid{grid-template-columns:1fr;} }
  .cover{position:relative;border-radius:12px;border:1px solid var(--card-border);cursor:pointer;overflow:hidden;transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;background:var(--card);}
  .cover:hover{transform:translateY(-4px);border-color:var(--gold-dim);box-shadow:0 10px 26px rgba(0,0,0,0.35);}
  .photo-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--bg-soft);}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover .done-badge{position:absolute; top:10px; right:10px;font-family:'IBM Plex Mono',monospace; font-size:10px;background:rgba(0,0,0,0.5); color:var(--gold);padding:3px 7px; border-radius:10px; border:1px solid var(--gold-dim);display:none;}
  .cover.complete .done-badge{display:block;}
  .overlay{position:fixed; inset:0; background:rgba(10,9,7,0.82);display:none; align-items:center; justify-content:center; padding:20px; z-index:50;backdrop-filter:blur(3px);}
  .overlay.show{display:flex;}
  .modal{background:var(--bg-soft); border:1px solid var(--card-border); border-radius:16px;max-width:520px; width:100%; padding:28px 26px 24px; position:relative;max-height:88vh; overflow-y:auto;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .modal-title{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--gold);}
  .q-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
  .close-btn{position:absolute; top:16px; right:18px; background:none; border:none; color:var(--text-dim);font-size:20px; cursor:pointer; line-height:1;}
  .close-btn:hover{color:var(--gold);}
  .q-text{font-family:'Inter',sans-serif;font-weight:600;font-size:17px;margin:18px 0 14px;line-height:1.4;}
  textarea.answer-box{width:100%; min-height:90px; resize:vertical;background:var(--card); border:1px solid var(--card-border); border-radius:8px;color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; padding:12px 14px;}
  textarea.answer-box:focus{outline:none; border-color:var(--gold-dim);}
  .reveal-btn{margin-top:12px; background:transparent; border:1px dashed var(--card-border); color:var(--text-dim);font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:18px; cursor:pointer;}
  .reveal-btn:hover{border-color:var(--gold); color:var(--gold);}
  .sample-answer{display:none; margin-top:12px; padding:12px 14px; border-radius:8px;background:rgba(226,179,79,0.08); border:1px solid var(--gold-dim); color:var(--text-dim); font-size:13.5px; line-height:1.5;}
  .sample-answer.show{display:block;}
  .sample-answer b{color:var(--gold);}
  .next-row{display:flex;justify-content:flex-end;margin-top:20px;}
  .next-btn{background:var(--gold); color:#1a1710; border:none; font-weight:700; font-family:'Inter',sans-serif;padding:10px 20px; border-radius:20px; cursor:pointer; font-size:13.5px;}
  .next-btn:hover{filter:brightness(1.08);}
  .result-screen{text-align:center; padding:10px 0;}
  .result-screen .big{font-family:'Playfair Display',serif;font-weight:900;font-size:24px;color:var(--gold);margin-bottom:8px;}
  .result-screen p{color:var(--text-dim); font-size:14px; margin:0 0 20px;}
  .result-screen .again{background:transparent;border:1px solid var(--card-border);color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;cursor:pointer;}
  .result-screen .again:hover{border-color:var(--gold); color:var(--gold);}
  .finale{display:none; text-align:center; margin-top:36px; padding:30px;border:1px solid var(--gold-dim); border-radius:14px;background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);}
  .finale.show{display:block;}
  .finale .big{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:8px;}
  .finale p{color:var(--text-dim);margin:0;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Werba Way · Mówienie o hobby</div>
    <h1>Jakie mają <em>hobby</em>?</h1>
    <p class="instructions">Kliknij zdjęcie osoby i odpowiedz ustnie lub pisemnie na 5 pytań o jej hobby i wolnym czasie. Nie ma złych odpowiedzi — to ćwiczenie z wyobraźni!</p>
  </header>
  <div class="progress-wrap">
    <div class="progress-label"><span>Postęp</span><span><b id="progressCount">0</b> / <span id="progressTotal">6</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="finale" id="finale">
    <div class="big">Świetnie! 🎉</div>
    <p>Porozmawiałeś/aś o wszystkich sześciu osobach.</p>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<script>
const people = [
  {
    id: "reader",
    img: "https://images.unsplash.com/photo-1758525589763-db4544252225?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Man in hat reading and writing on park bench",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Wygląda na to, że lubi pisać i czytać — może pisze pamiętnik albo swoją pierwszą książkę." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Pewnie lubi siedzieć w parku, obserwować ludzi i zapisywać swoje myśli." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Wydaje mi się, że lubi samotność — pisanie wymaga ciszy i skupienia." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może jako dziecko dużo czytała i wymyślała własne historie." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Moglibyśmy pójść razem do kawiarni i opowiadać sobie historie." }
    ]
  },
  {
    id: "hiker",
    img: "https://images.unsplash.com/photo-1723764881665-5b40cea01c9b?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Woman hiking up a trail in the mountains",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Na pewno lubi wędrówki — jest ubrana na góry i wygląda na bardzo aktywną." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Prawdopodobnie spędza weekendy w górach albo w lesie, z dala od miasta." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Może umie cieszyć się samotnością w naturze, ale też lubi wędrować z przyjaciółmi." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może już jako dziecko uwielbiała biegać po dworze i odkrywać nowe miejsca." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Moglibyśmy razem pójść na szlak i podziwiać widoki z góry." }
    ]
  },
  {
    id: "chess",
    img: "https://images.unsplash.com/photo-1674631793982-b72fe2f99d42?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Man playing chess on a street",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Oczywiście szachy — gra na ulicy, więc pewnie robi to regularnie." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Może lubi też inne gry strategiczne, na przykład karty albo łamigłówki." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Gra w miejscu publicznym, więc chyba lubi towarzystwo innych ludzi." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może ktoś w rodzinie nauczył ją grać w szachy, gdy była mała." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Poprosiłbym/poprosiłabym, żeby nauczyła mnie lepiej grać w szachy." }
    ]
  },
  {
    id: "guitar",
    img: "https://images.unsplash.com/photo-1486994816305-105a487dac3b?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Woman playing guitar in the city",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Muzyka — umie grać na gitarze i pewnie robi to od wielu lat." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Może gra dla przyjemności na ulicy albo pisze własne piosenki." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Grając publicznie, chyba nie boi się ludzi — jest raczej otwarta." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może jako dziecko chodziła na lekcje muzyki albo śpiewu." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Warto byłoby posłuchać, jak gra, i może razem zaśpiewać." }
    ]
  },
  {
    id: "plant",
    img: "https://images.unsplash.com/photo-1609043239075-b84f30707c63?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Person holding a plant, smiling",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Ogrodnictwo — trzyma roślinę z wielką radością na twarzy." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Pewnie dba o swoje rośliny w domu albo pracuje w ogrodzie." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Opieka nad roślinami to raczej spokojne zajęcie, więc może lubi ciszę." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może pomagała rodzicom w ogrodzie, gdy była mała." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Moglibyśmy razem posadzić coś nowego w ogrodzie." }
    ]
  },
  {
    id: "cook",
    img: "https://images.unsplash.com/photo-1667489012383-ecd9a46375a7?fm=jpg&q=80&w=1200&auto=format&fit=crop",
    alt: "Person cooking in a kitchen",
    questions: [
      { q: "Jak myślisz, jakie hobby ma ta osoba? Dlaczego tak sądzisz?", sample: "Gotowanie — stoi w kuchni i wygląda na bardzo skupioną na pracy." },
      { q: "Co ta osoba lubi robić w wolnym czasie?", sample: "Może próbuje nowych przepisów albo gotuje dla rodziny i przyjaciół." },
      { q: "Czy ta osoba jest raczej towarzyska, czy lubi być sama? Uzasadnij.", sample: "Gotowanie może być zarówno wspólne, jak i samotne — trudno powiedzieć." },
      { q: "Czym ta osoba mogła się interesować jako dziecko?", sample: "Może jako dziecko pomagała babci albo mamie w kuchni." },
      { q: "Gdybyś spędził/spędziła z nią jeden dzień, co byście razem robili?", sample: "Ugotowalibyśmy razem coś nowego i zjedli wspólny obiad." }
    ]
  }
];

let doneCount = 0;
let currentPersonIdx = null;
let currentQ = 0;

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const progressCount = document.getElementById('progressCount');
const progressFill = document.getElementById('progressFill');
const finale = document.getElementById('finale');

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderGrid(){
  grid.innerHTML = '';
  const order = shuffle(people.map((p,i) => i));
  order.forEach(idx => {
    const p = people[idx];
    const div = document.createElement('div');
    div.className = 'cover' + (p.done ? ' complete' : '');
    div.innerHTML = `
      <div class="done-badge">✓ zrobione</div>
      <div class="photo-wrap"><img src="${p.img}" alt="${p.alt}"></div>
    `;
    div.addEventListener('click', () => openPerson(idx));
    grid.appendChild(div);
  });
}

function updateProgress(){
  progressCount.textContent = doneCount;
  progressFill.style.width = (doneCount / people.length * 100) + '%';
  if(doneCount >= people.length){
    finale.classList.add('show');
  }
}

function openPerson(idx){
  currentPersonIdx = idx;
  currentQ = 0;
  overlay.classList.add('show');
  renderQuestion();
}

function renderQuestion(){
  const person = people[currentPersonIdx];
  if(currentQ >= person.questions.length){
    renderResult();
    return;
  }
  const q = person.questions[currentQ];
  modal.innerHTML = `
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="modal-header">
      <div class="modal-title">Osoba ${currentPersonIdx + 1}</div>
      <div class="q-count">Pytanie ${currentQ + 1} / ${person.questions.length}</div>
    </div>
    <div class="q-text">${q.q}</div>
    <textarea class="answer-box" placeholder="Napisz swoją odpowiedź (albo odpowiedz na głos)..."></textarea>
    <button class="reveal-btn" id="revealBtn">Pokaż przykładową odpowiedź</button>
    <div class="sample-answer" id="sampleAnswer"><b>Przykład:</b> ${q.sample}</div>
    <div class="next-row"><button class="next-btn" id="nextBtn">Dalej →</button></div>
  `;
  document.getElementById('closeBtn').addEventListener('click', closePerson);
  document.getElementById('revealBtn').addEventListener('click', () => {
    document.getElementById('sampleAnswer').classList.add('show');
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    currentQ++;
    renderQuestion();
  });
}

function renderResult(){
  const person = people[currentPersonIdx];
  if(!person.done){
    person.done = true;
    doneCount++;
    updateProgress();
  }
  modal.innerHTML = `
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="result-screen">
      <div class="big">Ukończono! ✅</div>
      <p>Omówiliście wszystkie 5 pytań o tej osobie.</p>
      <button class="again" id="backBtn">Wróć do zdjęć</button>
    </div>
  `;
  document.getElementById('closeBtn').addEventListener('click', closePerson);
  document.getElementById('backBtn').addEventListener('click', closePerson);
}

function closePerson(){
  overlay.classList.remove('show');
  renderGrid();
}

renderGrid();
updateProgress();
</script>
</body>
</html>
