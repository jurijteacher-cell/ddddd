<!DOCTYPE html>
  <html lang="pl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warto, należy, trzeba, można, wolno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#15130f; --bg-soft:#1c1a15; --card:#211f19; --card-border:#34302a;
    --gold:#e2b34f; --gold-dim:#7a6431; --text:#f2ede1; --text-dim:#a89d88;
          --ok:#6fae72; --bad:#b5555a;
      }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
        background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:16px 16px 80px;
}
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px; padding-top:16px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(24px,5vw,34px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold);font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:520px;margin:0 auto;line-height:1.5;}
  .sticky-zone{
        position:sticky; top:0; z-index:30;
    background:linear-gradient(to bottom, var(--bg) 85%, transparent);
    padding-top:6px; padding-bottom:14px; margin:0 -16px; padding-left:16px; padding-right:16px;
}
  .progress-wrap{max-width:460px;margin:16px auto 14px;}
  .progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:6px;}
  .progress-label b{color:var(--gold);}
  .progress-bar{height:6px;border-radius:4px;background:var(--bg-soft);border:1px solid var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}
  .bank{
        display:flex; flex-wrap:wrap; gap:10px;
    padding:14px 16px;
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:12px;
    min-height:52px;
    box-shadow:0 10px 24px rgba(0,0,0,0.45);
}
  .chip{font-family:'Playfair Display',serif; font-weight:700; font-size:15px;background:linear-gradient(135deg, var(--card), var(--bg-soft));border:1px solid var(--card-border);border-radius:8px;padding:9px 14px;cursor:grab;transition:opacity .2s ease, border-color .15s ease;white-space:nowrap;}
  .chip:hover{border-color:var(--gold-dim);}
  .chip.dragging{opacity:0.35;}
  .rows{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .row{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:14px 18px; font-size:15px; line-height:1.6;}
  .context{color:var(--text-dim); margin-bottom:6px;}
  .sentence-line{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .slot{
        display:inline-flex; align-items:center; justify-content:center;
    min-width:96px; padding:6px 12px;
    border:1.5px dashed var(--card-border); border-radius:6px;
    font-family:'Playfair Display',serif; font-weight:700; font-size:14.5px;
    color:var(--text-dim); transition:border-color .2s ease, background .2s ease;
}
  .slot.over{border-color:var(--gold); background:rgba(226,179,79,0.08);}
  .slot.correct{border-style:solid; border-color:var(--ok); color:var(--ok); background:rgba(111,174,114,0.08);}
  .slot.wrong{border-color:var(--bad); animation:shake .35s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .finale{display:none; text-align:center; margin-top:36px; padding:30px;border:1px solid var(--gold-dim); border-radius:14px;background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);}
  .finale.show{display:block;}
  .finale .big{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:8px;}
  .finale p{color:var(--text-dim);margin:0 0 18px;font-size:14px;}
  .reset-btn{background:transparent;border:1px solid var(--card-border);color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 22px;border-radius:20px;cursor:pointer;}
  .reset-btn:hover{border-color:var(--gold); color:var(--gold);}
</style>
  </head>
  <body>
  <div class="wrap">
    <div class="sticky-zone">
      <header>
        <div class="eyebrow">Werba Way · Gramatyka</div>
      <h1>Warto, należy, <em>trzeba, można, wolno</em></h1>
      <p class="instructions">Przeciągnij słowo z banku, żeby dokończyć zdanie-radę.</p>
      </header>
      <div class="progress-wrap">
        <div class="progress-label"><span>Postęp</span><span><b id="progressCount">0</b> / <span id="progressTotal">0</span></span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="bank" id="bank"></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="finale" id="finale">
      <div class="big">Świetnie! 📌</div>
      <p>Dopasowałeś/aś wszystkie zdania poprawnie.</p>
      <button class="reset-btn" id="resetBtn">Zacznij od nowa</button>
  </div>
</div>
<script>
const items = [
{ ctx: "To dobry serial.", before: "", word: "Warto", after: "go obejrzeć." },
  { ctx: "Jutro jest ważny egzamin.", before: "", word: "Trzeba", after: "się do niego przygotować." },
{ ctx: "W bibliotece jest cisza.", before: "Nie", word: "wolno", after: "tu głośno rozmawiać." },
{ ctx: "To bardzo nudny film.", before: "Nie", word: "warto", after: "go oglądać." },
{ ctx: "", before: "Przed startem samolotu", word: "należy", after: "zapiąć pasy." },
{ ctx: "W parku jest ładna pogoda.", before: "", word: "Można", after: "usiąść na trawie." },
{ ctx: "Masz problem ze zdrowiem.", before: "", word: "Należy", after: "iść do lekarza." },
{ ctx: "To muzeum ma darmowy wstęp w niedzielę.", before: "", word: "Warto", after: "tam pójść." },
{ ctx: "Przy basenie jest mokro.", before: "Nie", word: "wolno", after: "tu biegać." },
{ ctx: "Ten produkt jest drogi i słabej jakości.", before: "Nie", word: "warto", after: "go kupować." }
];

let placedCount = 0;
const total = items.length;

const bank = document.getElementById('bank');
const rows = document.getElementById('rows');
const progressCount = document.getElementById('progressCount');
const progressTotal = document.getElementById('progressTotal');
const progressFill = document.getElementById('progressFill');
const finale = document.getElementById('finale');

function shuffle(arr){
    const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function build(){
    placedCount = 0;
  progressTotal.textContent = total;
  progressCount.textContent = 0;
  progressFill.style.width = '0%';
  finale.classList.remove('show');
  bank.innerHTML = '';
      rows.innerHTML = '';

  const wordOrder = shuffle(items.map((it, i) => i));
  wordOrder.forEach(idx => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = items[idx].word;
    chip.dataset.idx = idx;
    chip.draggable = true;
    bank.appendChild(chip);
});

  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    let html = '';
    if(item.ctx) html += `<div class="context">${item.ctx}</div>`;
    html += `<div class="sentence-line">`;
    if(item.before) html += `<span>${item.before}</span>`;
    html += `<span class="slot" data-idx="${idx}">?</span>`;
    html += `<span>${item.after}</span>`;
    html += `</div>`;
    row.innerHTML = html;
    rows.appendChild(row);
});

  attachDragHandlers();
}

function attachDragHandlers(){
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('dragstart', onDragStart);
    chip.addEventListener('dragend', onDragEnd);
});
  document.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('dragover', onDragOver);
    slot.addEventListener('dragleave', onDragLeave);
    slot.addEventListener('drop', onDrop);
});
}

let draggedChip = null;

function onDragStart(e){
  draggedChip = e.currentTarget;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  setTimeout(() => draggedChip.classList.add('dragging'), 0);
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  draggedChip = null;
}
function onDragOver(e){
  const slot = e.currentTarget;
  if(slot.classList.contains('correct')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  slot.classList.add('over');
}
function onDragLeave(e){
  e.currentTarget.classList.remove('over');
}
function onDrop(e){
  e.preventDefault();
  const slot = e.currentTarget;
  slot.classList.remove('over');
  if(!draggedChip || slot.classList.contains('correct')) return;
  const chip = draggedChip;
  const idx = parseInt(slot.dataset.idx, 10);
  const expectedWord = items[idx].word;

  const chipWordLower = chip.textContent.trim().toLowerCase();
  const expectedWordLower = expectedWord.toLowerCase();

  if(chipWordLower === expectedWordLower){
    slot.textContent = expectedWord;
    slot.classList.add('correct');
    chip.style.display = 'none';
    placedCount++;
    progressCount.textContent = placedCount;
    progressFill.style.width = (placedCount / total * 100) + '%';
    if(placedCount === total){
      setTimeout(() => finale.classList.add('show'), 300);
}
} else {
    slot.classList.add('wrong');
    setTimeout(() => slot.classList.remove('wrong'), 400);
}
}

document.getElementById('resetBtn').addEventListener('click', build);

build();
</script>
</body>
</html>
