<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warto, należy, trzeba — dopasuj znaczenie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15130f; --bg-soft: #1c1a15; --card: #211f19; --card-border: #34302a;
    --gold: #e2b34f; --gold-dim: #7a6431; --text: #f2ede1; --text-dim: #a89d88;
    --ok: #6fae72; --bad: #b5555a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .filmstrip{display:flex; justify-content:center; gap:6px; margin-bottom:8px;}
  .hole{width:14px;height:10px;border-radius:2px;background:var(--bg-soft);border:1px solid var(--card-border);transition:background .4s ease, border-color .4s ease, box-shadow .4s ease;}
  .hole.lit{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(226,179,79,0.6);}
  header{text-align:center; margin-bottom:28px;}
  .eyebrow{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display', serif;font-weight:900;font-size:clamp(26px, 5vw, 40px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold); font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:540px;margin:0 auto;line-height:1.5;}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px;position:relative;}
  @media (max-width:680px){.board{grid-template-columns:1fr; gap:14px;}}
  .col-label{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;padding-left:4px;}
  .items{display:flex; flex-direction:column; gap:10px;}
  .ticket{position:relative;background:linear-gradient(135deg, var(--card), var(--bg-soft));border:1px solid var(--card-border);border-radius:10px;padding:16px 18px;font-family:'Playfair Display', serif;font-weight:700;font-size:19px;cursor:pointer;user-select:none;transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .3s ease;}
  .ticket:hover{border-color:var(--gold-dim); transform:translateX(2px);}
  .ticket.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(226,179,79,0.25);color:var(--gold);}
  .ticket.matched{opacity:0.45;cursor:default;border-color:var(--ok);color:var(--ok);transform:none;}
  .ticket.wrong{animation:shake .35s ease;border-color:var(--bad);}
  .card{background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--card-border);border-radius:6px;padding:16px 18px;font-size:14.5px;line-height:1.5;color:var(--text-dim);cursor:pointer;user-select:none;transition:transform .18s ease, border-color .18s ease, color .18s ease;}
  .card:hover{border-left-color:var(--gold-dim); color:var(--text);}
  .card.selected{border-left-color:var(--gold);color:var(--text);box-shadow:0 0 18px rgba(226,179,79,0.15);}
  .card.matched{opacity:0.45;cursor:default;border-left-color:var(--ok);}
  .card.wrong{animation:shake .35s ease;border-left-color:var(--bad);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .footer{margin-top:36px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  .score{font-family:'IBM Plex Mono', monospace;font-size:13px;color:var(--text-dim);letter-spacing:0.05em;}
  .score b{color:var(--gold);}
  button.reset{background:transparent;border:1px solid var(--card-border);color:var(--text-dim);font-family:'Inter', sans-serif;font-size:13px;font-weight:600;padding:10px 18px;border-radius:20px;cursor:pointer;transition:border-color .2s ease, color .2s ease;}
  button.reset:hover{border-color:var(--gold); color:var(--gold);}
  .complete{display:none;text-align:center;margin-top:36px;padding:28px;border:1px solid var(--gold-dim);border-radius:12px;background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);}
  .complete.show{display:block;}
  .complete .big{font-family:'Playfair Display', serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:6px;}
  .complete p{color:var(--text-dim); margin:0; font-size:14px;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="filmstrip" id="filmstrip"></div>

  <header>
    <div class="eyebrow">Werba Way · Gramatyka</div>
    <h1>Kiedy używamy <em>tego słowa</em>?</h1>
    <p class="instructions">Kliknij słowo po lewej, a potem pasujące wyjaśnienie po prawej. Dopasuj wszystkie pary.</p>
  </header>

  <div class="board">
    <div>
      <div class="col-label">Słowo</div>
      <div class="items" id="genres"></div>
    </div>
    <div>
      <div class="col-label">Kiedy tego używamy?</div>
      <div class="items" id="descriptions"></div>
    </div>
  </div>

  <div class="footer">
    <div class="score">Dopasowane: <b id="scoreCount">0</b> / <span id="scoreTotal">0</span></div>
    <button class="reset" id="resetBtn">Zacznij od nowa</button>
  </div>

  <div class="complete" id="complete">
    <div class="big">Świetna robota! 📌</div>
    <p>Dopasowałeś/aś wszystkie słowa do ich znaczenia.</p>
  </div>

</div>

<script>
const pairs = [
  { genre: "Warto", desc: "Używamy, kiedy chcemy kogoś zachęcić do czegoś albo powiedzieć, że coś jest wartościowe, dobre." },
  { genre: "Nie warto", desc: "Używamy, kiedy odradzamy coś, mówimy, że to się nie opłaca." },
  { genre: "Należy", desc: "Używamy, kiedy mówimy o obowiązku albo zasadzie — często w oficjalnych sytuacjach, instrukcjach, regulaminach." },
  { genre: "Trzeba", desc: "Używamy, kiedy mówimy o konieczności w zwykłych, codziennych sytuacjach." },
  { genre: "Można", desc: "Używamy, kiedy coś jest dozwolone albo możliwe." },
  { genre: "Wolno", desc: "Podobne do „można” — używamy, kiedy mówimy o zasadach i przepisach." },
  { genre: "Nie wolno", desc: "Używamy, kiedy coś jest zakazane, zabronione." }
];

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let selectedGenre = null;
let selectedDesc = null;
let matchedCount = 0;

const genresEl = document.getElementById('genres');
const descEl = document.getElementById('descriptions');
const filmstripEl = document.getElementById('filmstrip');
const scoreCountEl = document.getElementById('scoreCount');
const scoreTotalEl = document.getElementById('scoreTotal');
const completeEl = document.getElementById('complete');
const resetBtn = document.getElementById('resetBtn');

function build(){
  matchedCount = 0;
  selectedGenre = null;
  selectedDesc = null;
  completeEl.classList.remove('show');
  scoreTotalEl.textContent = pairs.length;
  scoreCountEl.textContent = 0;

  genresEl.innerHTML = '';
  descEl.innerHTML = '';
  filmstripEl.innerHTML = '';

  const genreOrder = shuffle(pairs.map((p, i) => i));
  const descOrder = shuffle(pairs.map((p, i) => i));

  genreOrder.forEach(idx => {
    const div = document.createElement('div');
    div.className = 'ticket';
    div.textContent = pairs[idx].genre;
    div.dataset.idx = idx;
    div.tabIndex = 0;
    div.addEventListener('click', () => selectGenre(div, idx));
    genresEl.appendChild(div);
  });

  descOrder.forEach(idx => {
    const div = document.createElement('div');
    div.className = 'card';
    div.textContent = pairs[idx].desc;
    div.dataset.idx = idx;
    div.tabIndex = 0;
    div.addEventListener('click', () => selectDesc(div, idx));
    descEl.appendChild(div);
  });

  for(let i = 0; i < pairs.length; i++){
    const hole = document.createElement('div');
    hole.className = 'hole';
    filmstripEl.appendChild(hole);
  }
}

function selectGenre(el, idx){
  if(el.classList.contains('matched')) return;
  if(selectedGenre) selectedGenre.el.classList.remove('selected');
  selectedGenre = { el, idx };
  el.classList.add('selected');
  tryMatch();
}

function selectDesc(el, idx){
  if(el.classList.contains('matched')) return;
  if(selectedDesc) selectedDesc.el.classList.remove('selected');
  selectedDesc = { el, idx };
  el.classList.add('selected');
  tryMatch();
}

function tryMatch(){
  if(!selectedGenre || !selectedDesc) return;

  if(selectedGenre.idx === selectedDesc.idx){
    selectedGenre.el.classList.remove('selected');
    selectedDesc.el.classList.remove('selected');
    selectedGenre.el.classList.add('matched');
    selectedDesc.el.classList.add('matched');
    matchedCount++;
    scoreCountEl.textContent = matchedCount;
    const holes = filmstripEl.querySelectorAll('.hole');
    if(holes[matchedCount - 1]) holes[matchedCount - 1].classList.add('lit');
    selectedGenre = null;
    selectedDesc = null;
    if(matchedCount === pairs.length){
      setTimeout(() => completeEl.classList.add('show'), 300);
    }
  } else {
    const g = selectedGenre.el, d = selectedDesc.el;
    g.classList.add('wrong');
    d.classList.add('wrong');
    setTimeout(() => {
      g.classList.remove('wrong', 'selected');
      d.classList.remove('wrong', 'selected');
    }, 400);
    selectedGenre = null;
    selectedDesc = null;
  }
}

resetBtn.addEventListener('click', build);

build();
</script>
</body>
</html>
