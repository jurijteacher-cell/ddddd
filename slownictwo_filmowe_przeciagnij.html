<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Słownictwo filmowe — przeciągnij i upuść</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130f; --bg-soft:#1c1a15; --card:#211f19; --card-border:#34302a;
    --gold:#e2b34f; --gold-dim:#7a6431; --text:#f2ede1; --text-dim:#a89d88;
    --ok:#6fae72; --bad:#b5555a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:32px 16px 80px;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,5vw,38px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold);font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:520px;margin:0 auto;line-height:1.5;}

  .progress-wrap{max-width:460px;margin:22px auto 0;}
  .progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:6px;}
  .progress-label b{color:var(--gold);}
  .progress-bar{height:6px;border-radius:4px;background:var(--bg-soft);border:1px solid var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}

  .category{margin-top:44px;}
  .cat-title{
    font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:var(--gold);
    margin-bottom:4px; display:flex; align-items:center; gap:10px;
  }
  .cat-title .n{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);
    border:1px solid var(--card-border); border-radius:10px; padding:2px 8px;
  }

  .bank{
    display:flex; flex-wrap:wrap; gap:10px;
    margin:16px 0 22px;
    padding:14px;
    background:var(--bg-soft);
    border:1px dashed var(--card-border);
    border-radius:12px;
    min-height:52px;
  }
  .chip{
    font-family:'Playfair Display',serif; font-weight:700; font-size:15px;
    background:linear-gradient(135deg, var(--card), var(--bg-soft));
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:9px 14px;
    cursor:grab;
    touch-action:none;
    transition:opacity .2s ease, transform .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--gold-dim);}
  .chip.dragging{opacity:0.35;}
  .chip.placed{display:none;}
  .chip.floating{
    position:fixed; z-index:200; pointer-events:none;
    box-shadow:0 12px 28px rgba(0,0,0,0.5);
    border-color:var(--gold);
    color:var(--gold);
  }

  .rows{display:flex; flex-direction:column; gap:10px;}
  .row{
    display:flex; align-items:stretch; gap:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:12px 16px;
  }
  .slot{
    flex:0 0 auto;
    min-width:132px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    border:1.5px dashed var(--card-border);
    border-radius:8px;
    padding:8px 10px;
    font-family:'Playfair Display',serif; font-weight:700; font-size:14.5px;
    color:var(--text-dim);
    transition:border-color .2s ease, background .2s ease;
  }
  .slot.over{border-color:var(--gold); background:rgba(226,179,79,0.08);}
  .slot.correct{border-style:solid; border-color:var(--ok); color:var(--ok); background:rgba(111,174,114,0.08);}
  .slot.wrong{border-color:var(--bad); animation:shake .35s ease;}
  .def{
    flex:1; display:flex; align-items:center;
    font-size:14.5px; line-height:1.4; color:var(--text);
  }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  @media (max-width:560px){
    .row{flex-direction:column; gap:8px;}
    .slot{min-width:0; width:100%;}
  }

  .finale{
    display:none; text-align:center; margin-top:48px; padding:30px;
    border:1px solid var(--gold-dim); border-radius:14px;
    background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);
  }
  .finale.show{display:block;}
  .finale .big{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:8px;}
  .finale p{color:var(--text-dim);margin:0 0 18px;font-size:14px;}
  .reset-btn{
    background:transparent;border:1px solid var(--card-border);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 22px;border-radius:20px;cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--gold); color:var(--gold);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Werba Way · Słownictwo filmowe</div>
    <h1>Przeciągnij <em>słowo</em> do definicji</h1>
    <p class="instructions">Złap słowo z banku i upuść je w pustym miejscu obok pasującej definicji.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-label"><span>Postęp</span><span><b id="progressCount">0</b> / <span id="progressTotal">0</span></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="categories"></div>

  <div class="finale" id="finale">
    <div class="big">Świetna robota! 🎬</div>
    <p>Dopasowałeś/aś wszystkie słowa do definicji.</p>
    <button class="reset-btn" id="resetBtn">Zacznij od nowa</button>
  </div>
</div>

<script>
const data = [
  { cat: "Osoby", words: [
    { w: "aktor / aktorka", d: "Gra postać w filmie." },
    { w: "reżyser", d: "Kieruje pracą na planie i decyduje, jak będzie wyglądał film." },
    { w: "scenarzysta", d: "Pisze historię i dialogi do filmu." },
    { w: "producent", d: "Organizuje pieniądze i pracę potrzebną do zrobienia filmu." }
  ]},
  { cat: "Produkcja", words: [
    { w: "scenariusz", d: "Tekst z historią i dialogami, według którego grają aktorzy." },
    { w: "ścieżka dźwiękowa", d: "Muzyka, która gra w filmie." },
    { w: "efekty specjalne", d: "Obrazy zrobione na komputerze, które pokazują rzeczy niemożliwe w prawdziwym życiu." },
    { w: "charakteryzacja", d: "Makijaż i fryzura, które zmieniają wygląd aktora." },
    { w: "plan filmowy", d: "Miejsce, gdzie nagrywa się film." }
  ]},
  { cat: "Struktura", words: [
    { w: "scena", d: "Mała część filmu — jedna sytuacja pokazana w jednym miejscu." },
    { w: "odcinek", d: "Jedna część serialu." },
    { w: "sezon", d: "Grupa odcinków serialu, pokazywana razem, zwykle raz w roku." },
    { w: "fabuła", d: "Historia pokazana w filmie — co się dzieje od początku do końca." }
  ]},
  { cat: "Oglądanie", words: [
    { w: "napisy", d: "Tekst na dole ekranu, który pokazuje, co mówią aktorzy." },
    { w: "dubbing", d: "Nowe głosy nagrane w innym języku zamiast oryginalnych głosów aktorów." },
    { w: "lektor", d: "Jedna osoba, która czyta wszystkie dialogi filmu po polsku." }
  ]},
  { cat: "Dystrybucja i uznanie", words: [
    { w: "premiera", d: "Pierwszy pokaz filmu dla publiczności." },
    { w: "obsada", d: "Wszyscy aktorzy, którzy grają w filmie." },
    { w: "nagroda", d: "Coś, co dostaje film albo aktor za dobrą pracę." },
    { w: "kasa", d: "Pieniądze, które film zarobił w kinach." }
  ]}
];

let totalWords = 0;
let placedCount = 0;
data.forEach(c => totalWords += c.words.length);

const categoriesEl = document.getElementById('categories');
const progressCount = document.getElementById('progressCount');
const progressTotal = document.getElementById('progressTotal');
const progressFill = document.getElementById('progressFill');
const finale = document.getElementById('finale');

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function build(){
  placedCount = 0;
  progressTotal.textContent = totalWords;
  progressCount.textContent = 0;
  progressFill.style.width = '0%';
  finale.classList.remove('show');
  categoriesEl.innerHTML = '';

  data.forEach((cat, ci) => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerHTML = `${cat.cat} <span class="n">${cat.words.length}</span>`;
    catDiv.appendChild(title);

    const bank = document.createElement('div');
    bank.className = 'bank';
    const shuffledWords = shuffle(cat.words.map((w, i) => i));
    shuffledWords.forEach(idx => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = cat.words[idx].w;
      chip.dataset.cat = ci;
      chip.dataset.idx = idx;
      bank.appendChild(chip);
    });
    catDiv.appendChild(bank);

    const rows = document.createElement('div');
    rows.className = 'rows';
    const shuffledDefs = shuffle(cat.words.map((w, i) => i));
    shuffledDefs.forEach(idx => {
      const row = document.createElement('div');
      row.className = 'row';
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.cat = ci;
      slot.dataset.idx = idx;
      slot.textContent = '?';
      const def = document.createElement('div');
      def.className = 'def';
      def.textContent = cat.words[idx].d;
      row.appendChild(slot);
      row.appendChild(def);
      rows.appendChild(row);
    });
    catDiv.appendChild(rows);

    categoriesEl.appendChild(catDiv);
  });

  attachDragHandlers();
}

function attachDragHandlers(){
  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => {
    chip.addEventListener('pointerdown', onPointerDown);
  });
}

let activeChip = null;
let floatingEl = null;
let startX = 0, startY = 0;

function onPointerDown(e){
  const chip = e.currentTarget;
  activeChip = chip;
  chip.setPointerCapture(e.pointerId);
  const rect = chip.getBoundingClientRect();
  startX = e.clientX - rect.left;
  startY = e.clientY - rect.top;

  floatingEl = chip.cloneNode(true);
  floatingEl.classList.add('floating');
  floatingEl.style.width = rect.width + 'px';
  floatingEl.style.left = (e.clientX - startX) + 'px';
  floatingEl.style.top = (e.clientY - startY) + 'px';
  document.body.appendChild(floatingEl);
  chip.classList.add('dragging');

  chip.addEventListener('pointermove', onPointerMove);
  chip.addEventListener('pointerup', onPointerUp);
  chip.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(e){
  if(!floatingEl) return;
  floatingEl.style.left = (e.clientX - startX) + 'px';
  floatingEl.style.top = (e.clientY - startY) + 'px';

  floatingEl.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  floatingEl.style.display = '';

  document.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
  if(el && el.classList.contains('slot') && !el.classList.contains('correct')){
    el.classList.add('over');
  }
}

function onPointerUp(e){
  if(!activeChip) return;
  const chip = activeChip;

  floatingEl.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  floatingEl.style.display = '';

  let targetSlot = null;
  if(el && el.classList.contains('slot')){
    targetSlot = el;
  }

  if(targetSlot && !targetSlot.classList.contains('correct')){
    if(targetSlot.dataset.cat === chip.dataset.cat && targetSlot.dataset.idx === chip.dataset.idx){
      targetSlot.textContent = chip.textContent;
      targetSlot.classList.remove('over');
      targetSlot.classList.add('correct');
      chip.classList.add('placed');
      placedCount++;
      progressCount.textContent = placedCount;
      progressFill.style.width = (placedCount / totalWords * 100) + '%';
      if(placedCount === totalWords){
        setTimeout(() => finale.classList.add('show'), 300);
      }
    } else {
      targetSlot.classList.remove('over');
      targetSlot.classList.add('wrong');
      setTimeout(() => targetSlot.classList.remove('wrong'), 400);
    }
  }

  document.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
  chip.classList.remove('dragging');
  chip.removeEventListener('pointermove', onPointerMove);
  chip.removeEventListener('pointerup', onPointerUp);
  chip.removeEventListener('pointercancel', onPointerUp);
  floatingEl.remove();
  floatingEl = null;
  activeChip = null;
}

document.getElementById('resetBtn').addEventListener('click', build);

build();
</script>
</body>
</html>
