<!DOCTYPE html>
  <html lang="pl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prawda czy fałsz — samochód</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#15130f; --bg-soft:#1c1a15; --card:#211f19; --card-border:#34302a;
    --gold:#e2b34f; --gold-dim:#7a6431; --text:#f2ede1; --text-dim:#a89d88;
          --ok:#6fae72; --bad:#b5555a;
      }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
        background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,179,79,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:32px 16px 80px;
}
  .wrap{max-width:680px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,5vw,38px);margin:0 0 10px;letter-spacing:-0.01em;}
  h1 em{color:var(--gold);font-style:normal;}
  .instructions{color:var(--text-dim);font-size:15px;max-width:520px;margin:0 auto;line-height:1.5;}
  .progress-wrap{max-width:460px;margin:22px auto 32px;}
  .progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:6px;}
  .progress-label b{color:var(--gold);}
  .progress-bar{height:6px;border-radius:4px;background:var(--bg-soft);border:1px solid var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}
  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{
        background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    padding:20px 22px;
}
  .stmt{font-size:16px; line-height:1.5; color:var(--text); margin-bottom:16px;}
  .buttons{display:flex; gap:10px;}
  .btn{
        flex:1; font-family:'Playfair Display',serif; font-weight:700; font-size:15px;
    padding:11px 0; border-radius:8px; cursor:pointer;
    background:var(--bg-soft); border:1.5px solid var(--card-border); color:var(--text);
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover:not(:disabled){border-color:var(--gold-dim);}
  .btn:disabled{cursor:default;}
  .btn.correct{border-color:var(--ok); background:rgba(111,174,114,0.12); color:var(--ok);}
  .btn.wrong{border-color:var(--bad); background:rgba(181,85,90,0.12); color:var(--bad);}
  .explanation{
        display:none; margin-top:14px; padding:12px 14px; border-radius:8px;
    background:rgba(226,179,79,0.06); border:1px solid var(--gold-dim);
    color:var(--text-dim); font-size:13.5px; line-height:1.5;
  }
  .explanation.show{display:block;}
  .explanation b{color:var(--gold);}
  .finale{
        display:none; text-align:center; margin-top:36px; padding:30px;
    border:1px solid var(--gold-dim); border-radius:14px;
    background:radial-gradient(ellipse at 50% 0%, rgba(226,179,79,0.08), transparent 70%);
  }
  .finale.show{display:block;}
  .finale .big{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--gold);margin-bottom:8px;}
  .finale p{color:var(--text-dim);margin:0 0 18px;font-size:14px;}
  .reset-btn{
        background:transparent;border:1px solid var(--card-border);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 22px;border-radius:20px;cursor:pointer;
}
  .reset-btn:hover{border-color:var(--gold); color:var(--gold);}
</style>
  </head>
  <body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Werba Way · Samochód</div>
      <h1>Prawda czy <em>fałsz</em>?</h1>
      <p class="instructions">Przeczytaj zdanie i zdecyduj, czy to prawda, czy fałsz.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-label"><span>Postęp</span><span><b id="progressCount">0</b> / <span id="progressTotal">0</span></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="finale" id="finale">
      <div class="big">Koniec! 🚗</div>
      <p>Odpowiedziałeś/aś na wszystkie pytania.</p>
      <button class="reset-btn" id="resetBtn">Zacznij od nowa</button>
  </div>
</div>

<script>
const statements = [
{ s: "Benzyna jest droższa niż gaz (LPG).", correct: true, ex: "Tak, benzyna kosztuje więcej niż gaz — dlatego wiele osób wybiera LPG." },
  { s: "Samochód na gaz nie ma zbiornika na benzynę.", correct: false, ex: "To nieprawda — samochód na gaz ma DWA zbiorniki: jeden na benzynę i jeden na gaz." },
{ s: "Silnik diesla potrzebuje iskry, żeby zapalić paliwo.", correct: false, ex: "Diesel nie potrzebuje iskry — paliwo zapala się samo od wysokiej temperatury." },
{ s: "Samochód na gaz ma dodatkową instalację.", correct: true, ex: "Zgadza się — instalacja gazowa to dodatkowy element w samochodzie." },
{ s: "Diesel zużywa mniej paliwa na długich trasach.", correct: true, ex: "Tak, dlatego diesel jest popularny wśród kierowców, którzy jeżdżą dużo." },
{ s: "Instalacja gazowa jest zawsze bezpłatna.", correct: false, ex: "Nie — instalacja gazowa kosztuje na początku, ale potem gaz jest tańszy." },
{ s: "Silnik diesla jest zwykle głośniejszy niż silnik benzynowy.", correct: true, ex: "Prawda — to jedna z wad diesla." },
{ s: "Akumulator daje energię elektryczną, np. do świateł.", correct: true, ex: "Dokładnie tak — akumulator to źródło prądu w samochodzie." },
{ s: "Kierownica służy do hamowania.", correct: false, ex: "Nie — kierownica służy do skręcania. Do hamowania służą hamulce." },
{ s: "Zimą silnik na gaz czasem trzeba najpierw uruchomić na benzynie.", correct: true, ex: "Tak — to typowa cecha instalacji LPG w zimnych temperaturach." }
];

let answeredCount = 0;
const total = statements.length;

const cardsEl = document.getElementById('cards');
const progressCount = document.getElementById('progressCount');
const progressTotal = document.getElementById('progressTotal');
const progressFill = document.getElementById('progressFill');
const finale = document.getElementById('finale');

function build(){
    answeredCount = 0;
  progressTotal.textContent = total;
  progressCount.textContent = 0;
  progressFill.style.width = '0%';
  finale.classList.remove('show');
  cardsEl.innerHTML = '';

  statements.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
    card.innerHTML = `
            <div class="stmt">${idx + 1}. ${item.s}</div>
        <div class="buttons">
          <button class="btn" data-answer="true">Prawda</button>
          <button class="btn" data-answer="false">Fałsz</button>
        </div>
        <div class="explanation"><b>Wyjaśnienie:</b> ${item.ex}</div>
      `;
    const buttons = card.querySelectorAll('.btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = btn.dataset.answer === 'true';
        buttons.forEach(b => b.disabled = true);
        if(chosen === item.correct){
          btn.classList.add('correct');
} else {
          btn.classList.add('wrong');
          buttons.forEach(b => {
            if((b.dataset.answer === 'true') === item.correct) b.classList.add('correct');
});
}
        card.querySelector('.explanation').classList.add('show');
        answeredCount++;
        progressCount.textContent = answeredCount;
        progressFill.style.width = (answeredCount / total * 100) + '%';
        if(answeredCount === total){
          setTimeout(() => finale.classList.add('show'), 300);
}
});
});
    cardsEl.appendChild(card);
});
}

document.getElementById('resetBtn').addEventListener('click', build);

build();
</script>
</body>
</html>
